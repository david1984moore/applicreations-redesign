      <stop offset="0%" stop-color="#c5d9e8"/>
      <stop offset="45%" stop-color="#e8eef3"/>
      <stop offset="70%" stop-color="#f3ebe0"/>
      <stop offset="100%" stop-color="#e8d9c4"/>
